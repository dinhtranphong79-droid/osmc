<style>
  .phuthuy-wrapper { font-family: Arial, sans-serif; }
  .phuthuy-wrapper .container { display: flex; gap: 20px; flex-wrap: wrap; }
  .phuthuy-wrapper .t-card { 
    background: #ffffff; 
    border-radius: 12px; 
    padding: 12px; 
    width: 300px; 
    box-shadow: 0 4px 10px rgba(0,0,0,0.08); 
  }
  .phuthuy-wrapper .buoi { 
    display: flex; 
    align-items: center; 
    justify-content: space-between; 
    padding: 8px 10px; 
    border-radius: 8px; 
    margin-bottom: 6px; 
    font-weight: bold; 
    color: #333; 
    transition: background 0.3s; 
  }
  .phuthuy-wrapper .xanh-duong { background-color: #93c5fd; } 
  .phuthuy-wrapper .xanh-duong.active { background-color: #3B82F6; color: #fff; } 
  .phuthuy-wrapper .do { background-color: #fca5a5; }
  .phuthuy-wrapper .do.active { background-color: #EF4444; color: #fff; }
  .phuthuy-wrapper .xanh-ngoc { background-color: #5eead4; }
  .phuthuy-wrapper .xanh-ngoc.active { background-color: #14B8A6; color: #fff; }
  .phuthuy-wrapper .tim { background-color: #d8b4fe; }
  .phuthuy-wrapper .tim.active { background-color: #A855F7; color: #fff; }
  .phuthuy-wrapper .vang { background-color: #fef08a; } 
  .phuthuy-wrapper .vang.active { background-color: #CA8A04; color: #fff; }
  .phuthuy-wrapper .xanh-la { background-color: #86efac; }
  .phuthuy-wrapper .xanh-la.active { background-color: #22C55E; color: #fff; }
  
  .phuthuy-wrapper input[type="number"] { 
    padding: 6px 10px; 
    border: 1px solid #cbd5e1; 
    border-radius: 6px; 
    outline: none;
    font-size: 14px;
  }
  .phuthuy-wrapper .input-level { width: 55px; text-align: center; }
  .phuthuy-wrapper .input-material { width: 150px; } 
  .phuthuy-wrapper .input-percent { width: 80px; }

  .phuthuy-wrapper .section-box { 
    background: #fff; 
    padding: 20px; 
    border-radius: 12px; 
    box-shadow: 0 4px 10px rgba(0,0,0,0.08); 
    margin-bottom: 20px; 
  }
  .phuthuy-wrapper .section-box h3 { margin-top: 0; color: #1e293b; }
  .phuthuy-wrapper .input-group { margin-bottom: 12px; display: flex; align-items: center; }
  .phuthuy-wrapper .input-group label { display: inline-block; width: 220px; font-weight: 500; color: #475569; }
  
  .phuthuy-wrapper .total-percent-info {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed #e2e8f0;
    font-size: 13px;
    color: #64748b;
    line-height: 1.5;
  }
  
  .phuthuy-wrapper button.pt-btn { 
    margin-top: 10px; 
    padding: 12px 20px; 
    border: none; 
    border-radius: 8px; 
    background: #3B82F6; 
    color: #fff; 
    cursor: pointer; 
    font-weight: bold; 
    font-size: 15px;
    box-shadow: 0 4px 6px rgba(59, 130, 246, 0.3);
    transition: background 0.2s;
  }
  .phuthuy-wrapper button.pt-btn:hover { background: #2563EB; }
  
  .phuthuy-wrapper .summary { margin-top: 25px; }
  .phuthuy-wrapper ul { padding-left: 20px; }
  .phuthuy-wrapper li { margin-bottom: 6px; color: #334155; }
</style>

<!-- Nội dung giao diện -->
<div class="phuthuy-wrapper">
<div class="section-box">
  <h3>Tài nguyên</h3>
  <div class="input-group"><label>Thuốc thử ánh sáng:</label> <input type="number" id="thuocThu" class="input-material" value="0" min="0"></div>
  <div class="input-group"><label>Thuốc tăng cường:</label> <input type="number" id="thuocTangCuong" class="input-material" value="0" min="0"></div>
  <div class="input-group"><label>Thuốc may mắn:</label> <input type="number" id="thuocMayMan" class="input-material" value="0" min="0"></div>
</div>

<div class="section-box">
  <h3>Đối đầu (để trống nếu tính lcch)</h3>
  <div class="input-group"><label>Chuyên gia đối đầu 1:</label> <input type="number" id="expert1" class="input-percent" value="0" min="0" step="0.1" oninput="updateTotalPercents()">%</div>
  <div class="input-group"><label>Chuyên gia đối đầu 2:</label> <input type="number" id="expert2" class="input-percent" value="0" min="0" step="0.1" oninput="updateTotalPercents()">%</div>
  <div class="input-group"><label>Đối đầu - Thuốc phù thủy:</label> <input type="number" id="dinhThuocPT" class="input-percent" value="0" min="0" step="0.1" oninput="updateTotalPercents()">%</div>
  <div class="input-group"><label>Đối đầu - Kim cương phù thủy:</label> <input type="number" id="dinhKimCươngPT" class="input-percent" value="0" min="0" step="0.1" oninput="updateTotalPercents()">%</div>
  
  <div class="total-percent-info">
    <div>• Tổng % tăng - Thuốc thử ánh sáng: <strong id="sumThuocThu">0%</strong></div>
    <div>• Tổng % tăng - Bụi: <strong id="sumNguyenLieu">0%</strong></div>
  </div>
</div>

<div class="container" id="tContainer"></div>

<button onclick="tinhToan()">Tính</button>

<div class="section-box summary">
  <h2>Bảng tổng kết</h2>
  <p id="summaryDetail">Nhập thông tin và bấm tính toán để xem kết quả.</p>
  <h3>Level sau nâng</h3>
  <ul id="suggestList"></ul>
</div>

<script>
const TData = {
  T1: {boost: 30, luck: 5},
  T2: {boost: 90, luck: 20},
  T3: {boost: 430, luck: 80},
  T4: {boost: 2110, luck: 400},
  T5: {boost: 10530, luck: 2000},
  T6: {boost: 52640, luck: 10000},
  T7: {boost: 263160, luck: 50000},
  T8: {boost: 1315790, luck: 250000},
  T9: {boost: 6578950, luck: 1250000}
};

const buoiColors = [
  {name:"Xanh Dương", class:"xanh-duong"},
  {name:"Đỏ", class:"do"},
  {name:"Xanh Ngọc", class:"xanh-ngoc"},
  {name:"Tím", class:"tim"},
  {name:"Vàng", class:"vang"},
  {name:"Xanh Lá", class:"xanh-la"}
];

const MAX_LEVEL = 20;

// Render T và bụi
const tContainer = document.getElementById("tContainer");
for (let t in TData) {
  const tCard = document.createElement("div");
  tCard.className = "t-card";
  tCard.innerHTML = `<h3>${t}</h3>`;
  buoiColors.forEach((b)=>{
    const buoiDiv = document.createElement("div");
    buoiDiv.className = `buoi ${b.class}`;
    buoiDiv.innerHTML = `
      <label>
        <input type="checkbox" class="checkbox-buoi" data-t="${t}" data-buoi="${b.name}">
        ${b.name}
      </label>
      <input type="number" class="input-level" data-t="${t}" data-buoi="${b.name}" value="0" min="0" max="${MAX_LEVEL}" disabled>
    `;
    tCard.appendChild(buoiDiv);
  });
  tContainer.appendChild(tCard);
}

// Bật/tắt input level, mặc định là 1 khi tích chọn
document.querySelectorAll(".checkbox-buoi").forEach(cb=>{
  cb.addEventListener("change", ()=>{
    const t = cb.dataset.t;
    const buoi = cb.dataset.buoi;
    const input = document.querySelector(`.input-level[data-t="${t}"][data-buoi="${buoi}"]`);
    input.disabled = !cb.checked;
    const parentDiv = cb.closest(".buoi");
    if(cb.checked){
      parentDiv.classList.add("active");
      input.value = 1; 
    } else {
      parentDiv.classList.remove("active");
      input.value = 0; 
    }
  });
});

function updateTotalPercents() {
  const expert1 = parseFloat(document.getElementById("expert1").value) || 0;
  const expert2 = parseFloat(document.getElementById("expert2").value) || 0;
  const dinhThuocPT = parseFloat(document.getElementById("dinhThuocPT").value) || 0;
  const dinhKimCươngPT = parseFloat(document.getElementById("dinhKimCươngPT").value) || 0;

  const totalThuocThu = expert1 + expert2 + dinhThuocPT;
  const totalNguyenLieu = expert1 + expert2 + dinhKimCươngPT;

  document.getElementById("sumThuocThu").textContent = totalThuocThu + "%";
  document.getElementById("sumNguyenLieu").textContent = totalNguyenLieu + "%";
}

function tinhToan(){
  const thuocThu = parseInt(document.getElementById("thuocThu").value) || 0;
  const initialTC = parseInt(document.getElementById("thuocTangCuong").value) || 0;
  const initialMM = parseInt(document.getElementById("thuocMayMan").value) || 0;

  const expert1 = parseFloat(document.getElementById("expert1").value) || 0;
  const expert2 = parseFloat(document.getElementById("expert2").value) || 0;
  const dinhThuocPT = parseFloat(document.getElementById("dinhThuocPT").value) || 0;
  const dinhKimCươngPT = parseFloat(document.getElementById("dinhKimCươngPT").value) || 0;

  const bonusThuocThu = 1 + (expert1 + expert2 + dinhThuocPT) / 100;
  const bonusNguyenLieu = 1 + (expert1 + expert2 + dinhKimCươngPT) / 100;

  let tempTC = initialTC;
  let tempMM = initialMM;
  
  let totalTCUsed = 0;
  let totalMMUsed = 0;
  
  const inputs = document.querySelectorAll(".input-level");
  const suggestList = [];

  // Mô phỏng quá trình nâng từ cấp hiện tại lên tối đa dựa trên kho nguyên liệu
  inputs.forEach(inp => {
    const t = inp.dataset.t;
    const buoi = inp.dataset.buoi;
    const cb = document.querySelector(`.checkbox-buoi[data-t="${t}"][data-buoi="${buoi}"]`);
    if(!cb.checked) return;

    let level = parseInt(inp.value) || 0;
    if(level > MAX_LEVEL) level = MAX_LEVEL;

    const boost = TData[t].boost;
    const luck = TData[t].luck;

    let currentLvl = level;
    while(currentLvl < MAX_LEVEL) {
      const nextLvl = currentLvl + 1;
      const tcReq = boost;
      const mmReq = (nextLvl > 10) ? luck : 0;

      if(tcReq <= tempTC && mmReq <= tempMM) {
        tempTC -= tcReq;
        tempMM -= mmReq;
        totalTCUsed += tcReq;
        if(nextLvl >= 10) {
          totalMMUsed += mmReq;
        }
        currentLvl++;
      } else {
        break;
      }
    }

    suggestList.push(`${t} - ${buoi}: ${level} → ${currentLvl}`);
  });

  // Tính điểm dựa trên tổng nguyên liệu sẽ tiêu thụ từ hành trình nâng cấp
  const diemTC = Math.round(totalTCUsed * 0.28 * bonusNguyenLieu);
  const diemMM = Math.round(totalMMUsed * 2.8 * bonusNguyenLieu);
  const diemThu = Math.round(thuocThu * 70 * bonusThuocThu);
  const tongDiem = diemTC + diemMM + diemThu;

  // Hiển thị kết quả
  document.getElementById("summaryDetail").innerHTML = `
    Thuốc tăng cường đã dùng: ${totalTCUsed.toLocaleString()} (Điểm: ${diemTC.toLocaleString()})<br>
    Thuốc may mắn đã dùng: ${totalMMUsed.toLocaleString()} (Điểm: ${diemMM.toLocaleString()})<br>
    Thuốc thử ánh sáng: ${thuocThu.toLocaleString()} (Điểm: ${diemThu.toLocaleString()})<br>
    <b>Tổng điểm: ${tongDiem.toLocaleString()}</b>
  `;

  const ul = document.getElementById("suggestList");
  ul.innerHTML = "";
  suggestList.forEach(item=>{
    const li = document.createElement("li");
    li.textContent = item;
    ul.appendChild(li);
  });
}
</script>
